[package]
name = "mclre-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Authoritative server simulation: fixed 20 TPS tick, entities, physics, AI, fluids, redstone, explosions."

[lints]
workspace = true

[features]
# Faithful bugs feature flag (SPEC §3.3): enables documented deviations from reference behavior
# that are known bugs in the baseline but must be preserved for world/compatibility.
faithful_bugs = []

[dependencies]
mclre-core = { path = "../core" }
mclre-world = { path = "../world" }
mclre-protocol = { path = "../protocol" }
mclre-identity = { path = "../identity" }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
bevy_ecs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
