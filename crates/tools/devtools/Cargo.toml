[package]
name = "mclre-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Developer tools: reference-data extractors, registry dumpers, worldgen viewers, packet inspectors, dependency-rule enforcement."

[[bin]]
name = "extract-legacy"
path = "src/bin/extract_legacy.rs"

[[bin]]
name = "extract-legacy-recipes"
path = "src/bin/extract_legacy_recipes.rs"

[[bin]]
name = "extract-legacy-furnace"
path = "src/bin/extract_legacy_furnace.rs"

[[bin]]
name = "extract-legacy-items"
path = "src/bin/extract_legacy_items.rs"

[[bin]]
name = "datafixer"
path = "src/bin/datafixer.rs"

[[bin]]
name = "worldgen-stress"
path = "src/bin/worldgen_stress.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono.workspace = true
mclre-core = { workspace = true }
mclre-world = { workspace = true }
mclre-worldgen = { workspace = true }
mclre-profiles = { workspace = true }

[dev-dependencies]
serde_json.workspace = true
