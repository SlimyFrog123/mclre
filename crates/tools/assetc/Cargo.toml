[package]
name = "mclre-assetc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "assetc: offline importer/converter for LCE assets (archives, textures, audio, languages)."

[[bin]]
name = "assetc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mclre-core.workspace = true
mclre-assets.workspace = true
thiserror.workspace = true
image.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
