# cargo-deny policy (SPEC.md 14/16): licenses per PLAN M0; block known advisories.

[graph]
all-features = true

[licenses]
version = 2
# Pre-approved list (dependencies not yet in the graph; warnings for unused entries disabled).
unused-allowed-license = "allow"
# Keep in sync with ADR 0013. Flag (do not yet hard-deny) copyleft until owner confirms.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
