---

scenario: "tnt_drops_items"
description: "TNT explosion drops items from destroyed blocks"
profile: "lce:141217"
category: "tnt"

setup:
  world:
    block_at_0_65_0: "minecraft:tnt"
    block_at_1_65_0: "minecraft:diamond_ore"
    block_at_2_65_0: "minecraft:chest"
    block_at_2_65_1: "minecraft:chest"  # Double chest
    # Fill chest with items
    chest_contents:
      - slot: 0
        item: "minecraft:diamond"
        count: 5
      - slot: 1
        item: "minecraft:iron_ingot"
        count: 10

action:
  type: "prime_tnt"
  position: [0, 65, 0]

action2:
  type: "tick"
  ticks: 100

expected:
  # Items dropped from destroyed blocks
  # Diamond ore drops diamond (unless silk touch)
  entity_dropped_diamond: true
  # Chest contents dropped
  entity_dropped_chest_items:
    - item: "minecraft:chest"
      count: 2
    - item: "minecraft:diamond"
      count: 5
    - item: "minecraft:iron_ingot"
      count: 10

# Reference: Explosion.cpp - drop items from destroyed blocks
# Blocks drop their normal drops unless explosion suppresses them