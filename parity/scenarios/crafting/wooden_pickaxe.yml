# Test: Crafting table recipe (shaped)
scenario: "crafting_table_crafting"
description: "Crafting table from 4 planks in 2x2"
profile: "lce:141217"
category: "crafting"

# [REF: Recipes.cpp:54-59] - addShapedRecipy for wood (4 planks from 1 log)
# Crafting table: 4 planks in 2x2 -> crafting table

setup:
  player:
    gamemode: Survival
  inventory_crafting:
    # 2x2 player inventory grid
    grid:
      - "minecraft:oak_planks"
      - "minecraft:oak_planks"
      - "minecraft:oak_planks"
      - "minecraft:oak_planks"

action:
  type: "craft"
  grid_size: "small"  # 2x2 player inventory

expected:
  result:
    item: "minecraft:crafting_table"
    count: 1
    damage: 0
  consumed:
    - item: "minecraft:oak_planks"
      count: 4
  recipe_group: "Tools"

