# Test: Shapeless recipe - mushroom stew
scenario: "mushroom_stew_shapeless"
description: "Mushroom stew from bowl + red mushroom + brown mushroom (shapeless)"
profile: "lce:141217"
category: "crafting"

# [REF: FoodRecipies.cpp:37-40] - addShapelessRecipy for mushroom stew

setup:
  player:
    gamemode: Survival
  crafting_table:
    grid:
      - "minecraft:bowl"
      - "minecraft:red_mushroom"
      - "minecraft:brown_mushroom"
      - null
      - null
      - null
      - null
      - null
      - null

action:
  type: "craft"
  grid_size: "large"

expected:
  result:
    item: "minecraft:mushroom_stew"
    count: 1
    damage: 0
  consumed:
    - item: "minecraft:bowl"
      count: 1
    - item: "minecraft:red_mushroom"
      count: 1
    - item: "minecraft:brown_mushroom"
      count: 1
  recipe_group: "Food"

# Reference: FoodRecipies.cpp:37-40 uses addShapelessRecipy
# Order of ingredients doesn't matter for shapeless