# Parity test: Wooden pickaxe crafting recipe
# [REF: Recipes.cpp:54-59] - Plank recipes (4 planks from 1 log)
# [REF: Recipes.cpp:83-89] - Stick recipe (4 sticks from 2 planks)
# [REF: ToolRecipies.cpp:9-26] - Tool shapes and materials

scenario: "wooden_pickaxe_crafting"
description: "Wooden pickaxe crafted in 3x3 grid with correct pattern"
profile: "lce:141217"
category: "crafting"

# Reference: ToolRecipies.cpp shapes[0] = pickaxe shape
# L"XXX", L" # ", L" # "
# With # = stick, X = material (wood)

setup:
  player:
    gamemode: Survival
  crafting_table:
    # 3x3 grid (row-major order)
    # Row 0: X X X
    # Row 1:   #  
    # Row 2:   #  
    grid:
      - "minecraft:oak_planks"  # [0,0] X
      - "minecraft:oak_planks"  # [0,1] X
      - "minecraft:oak_planks"  # [0,2] X
      - null                      # [1,0] empty
      - "minecraft:stick"         # [1,1] #
      - null                      # [1,2] empty
      - null                      # [2,0] empty
      - "minecraft:stick"         # [2,1] #
      - null                      # [2,2] empty

action:
  type: "craft"
  grid_size: "large"  # 3x3 crafting table

expected:
  result:
    item: "minecraft:wooden_pickaxe"
    count: 1
    damage: 0
  consumed:
    - item: "minecraft:oak_planks"
      count: 3
    - item: "minecraft:stick"
      count: 2
  recipe_id: "minecraft:wooden_pickaxe"
  recipe_group: "Tools"

# Reference:
# [REF: ToolRecipies.cpp:9-26] - Pickaxe shape (shapes[0])
# [REF: ToolRecipies.cpp:30-36] - Material map[0] = wood, cobblestone, iron, diamond, gold
# [REF: ToolRecipies.cpp:38-42] - Result map[1] = pickaxe variants
# [REF: ToolRecipies.cpp:63-105] - addRecipes loop generates all 5 tiers x 4 tool types

