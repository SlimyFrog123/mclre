# Parity test: Basic redstone circuits
# [REF: RedstoneDust.cpp] - Redstone dust propagation
# [REF: RedstoneWire.cpp] - Dust signal strength
# [REF: RedstoneRepeater.cpp] - Repeater delay
# [REF: RedstoneComparator.cpp] - Comparator modes

scenario: "redstone_dust_propagation"
description: "Redstone dust propagates signal strength 15 down to 0 over 15 blocks"
profile: "lce:141217"
category: "redstone"

# Signal strength decreases by 1 per block of dust
# Vertical movement doesn't reduce signal (if supported by block)

setup:
  world:
    # Power source at x=0
    block_at_0_64_0: "minecraft:redstone_block"  # Power level 15
    # Dust line from x=1 to x=15
    block_at_1_64_0: "minecraft:redstone_wire"
    block_at_2_64_0: "minecraft:redstone_wire"
    block_at_3_64_0: "minecraft:redstone_wire"
    block_at_4_64_0: "minecraft:redstone_wire"
    block_at_5_64_0: "minecraft:redstone_wire"
    block_at_6_64_0: "minecraft:redstone_wire"
    block_at_7_64_0: "minecraft:redstone_wire"
    block_at_8_64_0: "minecraft:redstone_wire"
    block_at_9_64_0: "minecraft:redstone_wire"
    block_at_10_64_0: "minecraft:redstone_wire"
    block_at_11_64_0: "minecraft:redstone_wire"
    block_at_12_64_0: "minecraft:redstone_wire"
    block_at_13_64_0: "minecraft:redstone_wire"
    block_at_14_64_0: "minecraft:redstone_wire"
    block_at_15_64_0: "minecraft:redstone_wire"
    # At x=16, signal should be 0 (no dust or unpowered)
    block_at_16_64_0: "minecraft:redstone_wire"

action:
  type: "tick"
  ticks: 5  # Allow signal to propagate

expected:
  # Signal strength at each position (15 - distance)
  # Distance measured from power source
  block_at_1_64_0_strength: 14
  block_at_2_64_0_strength: 13
  block_at_3_64_0_strength: 12
  block_at_4_64_0_strength: 11
  block_at_5_64_0_strength: 10
  block_at_6_64_0_strength: 9
  block_at_7_64_0_strength: 8
  block_at_8_64_0_strength: 7
  block_at_9_64_0_strength: 6
  block_at_10_64_0_strength: 5
  block_at_11_64_0_strength: 4
  block_at_12_64_0_strength: 3
  block_at_13_64_0_strength: 2
  block_at_14_64_0_strength: 1
  block_at_15_64_0_strength: 0  # Signal dies here
  block_at_16_64_0_strength: 0  # No signal

# Reference: RedstoneDust.cpp - signal propagation
# Signal decreases by 1 per horizontal block
# Vertical movement free if block supports it

