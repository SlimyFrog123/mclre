scenario: "armor_slots"
description: "Armor equip/unequip works correctly"
profile: "lce:141217"
category: "inventory"

# Armor slots: 0=feet, 1=legs, 2=chest, 3=head
# Shift-click armor from inventory equips to correct slot
# Shift-click equipped armor unequips to inventory

setup:
  player:
    inventory:
      main:
        - slot: 0
          item: "minecraft:iron_helmet"
          count: 1
        - slot: 1
          item: "minecraft:iron_chestplate"
          count: 1
        - slot: 2
          item: "minecraft:iron_leggings"
          count: 1
        - slot: 3
          item: "minecraft:iron_boots"
          count: 1

action:
  type: "shift_click"
  from: "player_inventory"
  to: "armor"
  slot: 0  # Helmet

expected:
  armor_head: { item: "minecraft:iron_helmet", count: 1 }
  player_slot_0: { item: null }

---

action2:
  type: "shift_click"
  from: "player_inventory"
  to: "armor"
  slot: 1  # Chestplate (now at slot 0 after shift)

expected2:
  armor_chest: { item: "minecraft:iron_chestplate", count: 1 }
  player_slot_0: { item: null }

---

action3:
  type: "shift_click"
  from: "armor"
  to: "player_inventory"
  slot: "head"  # Unequip helmet

expected3:
  armor_head: { item: null }
  # Finds first empty inventory slot
  player_inventory_has_helmet: true

# Reference: Inventory.cpp slot mapping
# Armor slots: 0=feet, 1=legs, 2=chest, 3=head
# Shift-click logic in Container.cpp