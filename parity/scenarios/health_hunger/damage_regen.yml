scenario: "food_exhaustion"
description: "Actions consume hunger/saturation correctly"
profile: "lce:141217"
category: "health_hunger"

# Exhaustion values:
# Sprinting: 0.1 per meter
# Jumping: 0.05 per jump
# Attacking: 0.1 per attack
# Breaking block: 0.005 per block
# Swimming: 0.015 per meter

setup:
  player:
    hunger: 20
    saturation: 10.0

action:
  type: "sprint"
  distance: 100  # meters

expected:
  # 100 * 0.1 = 10 exhaustion
  # 10 exhaustion = 10 saturation lost (at 1:1)
  saturation: 0.0
  hunger: 19  # 1 hunger lost when saturation hits 0

---

action2:
  type: "attack"
  count: 20  # 20 attacks

expected2:
  # 20 * 0.1 = 2 exhaustion
  # 2 saturation lost
  # No hunger lost (saturation covers it)
  saturation: 8.0
  hunger: 20

# Reference: Player.cpp exhaustion values
# [REF: Player.cpp] - addExhaustion()