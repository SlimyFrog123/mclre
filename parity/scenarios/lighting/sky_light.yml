scenario: "block_light_propagation"
description: "Block light sources emit and propagate correctly"
profile: "lce:141217"
category: "lighting"

# Block light sources: glowstone=15, torch=14, redstone lamp=15, etc.
# Decreases by 1 per block air, blocked by opaque blocks

setup:
  world:
    # Glowstone at center
    block_at_0_64_0: "minecraft:glowstone"
    # Air around
    block_at_1_64_0: "minecraft:air"
    block_at_2_64_0: "minecraft:air"
    block_at_3_64_0: "minecraft:air"
    block_at_4_64_0: "minecraft:air"
    block_at_5_64_0: "minecraft:air"
    block_at_6_64_0: "minecraft:air"
    block_at_7_64_0: "minecraft:air"
    block_at_8_64_0: "minecraft:air"
    block_at_9_64_0: "minecraft:air"
    block_at_10_64_0: "minecraft:air"
    block_at_11_64_0: "minecraft:air"
    block_at_12_64_0: "minecraft:air"
    block_at_13_64_0: "minecraft:air"
    block_at_14_64_0: "minecraft:air"
    block_at_15_64_0: "minecraft:air"
    block_at_16_64_0: "minecraft:air"
    # Wall at x=5
    block_at_5_65_0: "minecraft:stone"
    block_at_5_64_0: "minecraft:stone"
    block_at_5_63_0: "minecraft:stone"

action:
  type: "tick"
  ticks: 1

expected:
  # Glowstone emits block light 15
  block_light_at_0_64_0: 15
  # Decreases by 1 per block
  block_light_at_1_64_0: 14
  block_light_at_2_64_0: 13
  block_light_at_3_64_0: 12
  block_light_at_4_64_0: 11
  block_light_at_5_64_0: 10
  # Wall at x=5 blocks light
  block_light_at_6_64_0: 0
  block_light_at_7_64_0: 0

# Reference: LightEngine.cpp - block light propagation
# Decreases by 1 per air block, 0 through opaque